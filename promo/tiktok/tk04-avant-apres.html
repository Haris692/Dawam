<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="video-output" content="dawam-tiktok-04-avant-apres.mp4">
<title>Dawam TikTok 04 — Avant / Après</title>
<link rel="stylesheet" href="../lib/base.css"><link rel="stylesheet" href="tk.css">
<!-- Format « avant / après » en écran partagé. -->
<style>
#stage{background:#1a140c}
.pan{position:absolute;left:0;width:1080px;height:950px;overflow:hidden}
.pan svg{display:block}
.pdim{position:absolute;inset:0;background:#0d0a06}
#divider{position:absolute;left:0;top:950px;width:1080px;height:20px;background:linear-gradient(90deg,#B4842E,#EAC876,#B4842E)}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div class="pan" id="top" style="top:0"><svg id="sTop" width="1080" height="950" viewBox="40 780 1000 880" preserveAspectRatio="xMidYMid slice"></svg><div class="pdim" id="dTop"></div></div>
  <div class="pan" id="bot" style="top:970px"><svg id="sBot" width="1080" height="950" viewBox="0 800 1080 950" preserveAspectRatio="xMidYMid slice"></svg><div class="pdim" id="dBot"></div></div>
  <div id="divider"></div>
</div></div>
<script src="../lib/engine.js"></script><script src="../lib/cartoon.js"></script><script src="../lib/decor.js"></script><script src="tk.js"></script>
<script>
'use strict';
const R = {};
const PAL = {
  wall: ['#232849', '#4F4A70', '#E9D8C4'], base: ['#1D2140', '#433E60', '#D9C4AA'], floor: ['#1A1E3E', '#3F3A58', '#C49E7B'],
  floorLine: ['#20244A', '#47415F', '#B38D6B'], rug: ['#2B2F57', '#5B4F6E', '#D8B48A'], rugLine: ['#363A66', '#6E5F7C', '#E6C79E'],
  frame: ['#30355E', '#625C82', '#F2E8DA'], sill: ['#2B3058', '#5A5479', '#EADFCF'], rod: ['#3A3F68', '#6B6488', '#B8936A'],
  curtain: ['#2F4A6A', '#4F6F8A', '#7FA3B8'], curtainLine: ['#25405E', '#456480', '#6E92A8'],
  skyTop: ['#0E1433', '#2A2F66', '#8EC5E8'], skyBot: ['#2A2A5C', '#7A5689', '#DDEFF7'], city: ['#0A0E26', '#1F1B3D', '#7E8AA0'],
  artFrame: ['#3A3557', '#6A5E7A', '#B8936A'], art: ['#2C3155', '#5E587C', '#F5EDE0'], artLine: ['#6B6286', '#A08C9C', '#BA7517'],
  stand: ['#2F2A45', '#5A4A5E', '#9C6B4A'], standTop: ['#383250', '#655467', '#B07D58'], lampStem: ['#3C3652', '#665A70', '#8C6A50'], lampShade: ['#4A4466', '#8A7E92', '#F2E3C8'],
  bedWood: ['#30283F', '#5B4858', '#8E5E44'], bedWoodDark: ['#251F33', '#4A3A48', '#6E4632'],
  sheet: ['#3A4270', '#7A7FA6', '#F2EEE6'], pillow: ['#46507E', '#8A8FB5', '#FBF8F2'], blanket: ['#2E4C6E', '#4F6F94', '#3E7C9A'], blanketLine: ['#253F5E', '#44628A', '#356C88'],
};
const YAC = { skin: '#C98A5E', hair: '#33221A', beard: true };
const chip = (st, txt, top) => el2(st, `<div class="c" style="top:${top}px"><div class="sticker white" style="position:relative;display:inline-block;font-size:36px">${txt}</div></div>`);
function build() {
  const st = $('#stage');
  R.A = bedroom($('#sTop'), PAL);
  R.ya = new Toon(R.A.person, Object.assign({ top: '#7FA7D6', collar: 'pyjama', legs: 'none' }, YAC));
  R.B = dawnRoom($('#sBot'));
  R.yb = new Toon(R.B.person, Object.assign({ top: '#F4EFE6', bottom: '#F4EFE6', collar: 'qamis', kufi: '#FFFFFF', legs: 'cross', sock: '#FFFFFF' }, YAC));
  R.lapPhone = el('g', {}, R.B.front);
  R.lapPhone.innerHTML = '<rect x="-30" y="-11" width="60" height="22" rx="7" fill="#2B2A33" stroke="#3A2A26" stroke-width="5"/><rect x="-24" y="-6" width="48" height="12" rx="4" fill="#45444F"/>';
  R.lTop = cap(st, 'Avant Dawam 😮‍💨', 'k', 850);
  R.lBot = cap(st, 'Après Dawam 🤍', 'g', 1010);
  R.chips = [
    [chip(st, '01:47 · « encore 5 minutes de scroll »', 750), .4, 1.9],
    [chip(st, '05:52 · Répéter ⏰', 750), 2.0, 3.3],
    [chip(st, '07:30 · Fajr raté… encore 😞', 750), 3.4, 4.7],
    [chip(st, '05:52 · « La séance de l\'aube t\'attend »', 1180), 4.9, 6.4],
    [chip(st, '06:10 · séance de l\'aube ✓', 1180), 6.5, 8.0],
    [chip(st, '🔥 21 jours de suite', 1180), 8.1, 9.6],
  ];
  R.motto = el2(st, '<div class="c" style="top:922px"><div class="sticker gold" style="position:relative;display:inline-block">Petit, mais constant.</div></div>');
  R.end = tkEnd(st);
}
function render(t) {
  // haut : scroll tard → s'allonge → repousse le réveil sans se réveiller → la matinée est déjà là
  const down = P(t, 1.9, .5, E.ioC), morning = P(t, 3.4, 1.0, E.ioC);
  paint(R.A.pal, lerp(.04, .95, morning));
  R.A.stars.setAttribute('opacity', (1 - morning).toFixed(3));
  R.A.moon.setAttribute('opacity', (1 - morning).toFixed(3));
  const ring = t > 2.3 && t < 3.0, snooze = P(t, 2.7, .25, E.ioC) * (1 - P(t, 3.05, .35, E.ioC));
  const b0 = bedBase(0), b = bedBase(1 - down), placed = down >= .5;
  const onBed = toHip(b0, 434, 1286), restL = toHip(b0, 452, 1290), lieR = toHip(b0, 560, 1215);
  const scroll = t < 1.9 ? Math.sin(t * 8) * 3 : 0;
  let hL = [lerp(-18, onBed[0], down), lerp(-64, onBed[1], down)];
  if (placed) hL = [lerp(restL[0], onBed[0], snooze), lerp(restL[1], onBed[1], snooze)];
  const hR = [lerp(18, lieR[0], down), lerp(-66 + scroll, lieR[1], down)];
  R.A.setBlanket(down);
  let face = { lid: .45, worry: .25, mouth: 'flat', look: [0, 4] };
  if (t > 2.05) face = { eyes: 'closed', mouth: 'small' };
  if (ring || snooze > 0) face = { eyes: 'closed', worry: .8, mouth: 'wavy' };
  if (t > 3.85) face = { eyes: 'wide', brow: 1, mouth: 'o' };
  if (t > 4.3) face = { lid: .15, worry: 1, mouth: 'frown' };
  const pose = Object.assign(b, { t, face, hands: { L: hL, R: hR }, phone: placed ? null : 'both', glow: .95, faceLight: .5,
    tilt: b.tilt + (t > 3.85 ? -10 * P(t, 3.85, .2) : 0) });
  R.ya.set(pose);
  R.ya.tint('#141A3C', lerp(.46, .04, morning));
  const buzz = ring ? Math.sin(t * 80) * 2.5 : 0;
  const lit = !placed ? .95 : (ring ? 1 : 0);
  R.A.setPhone(buzz, lit, placed);
  const pw = !placed ? R.ya.phoneWorld(pose) : [BED.phone[0], BED.phone[1]];
  for (const g of [R.A.glow, R.A.glow2]) { g.setAttribute('cx', f1(pw[0])); g.setAttribute('cy', f1(pw[1])); }
  R.A.glow.setAttribute('opacity', (.8 * lit * (1 - morning)).toFixed(3));
  R.A.glow2.setAttribute('opacity', (.3 * lit * (1 - down)).toFixed(3));
  // bas : séance de l'aube sur le tapis, le soleil se lève
  const sun = P(t, 4.8, 4.8, E.outC), k = lerp(.36, .68, P(t, 4.6, 5, E.ioS)), sy = lerp(1200, 1010, sun);
  paint(R.B.pal, k);
  R.B.stars.setAttribute('opacity', clamp(1 - (k - .3) * 3.2).toFixed(3));
  R.B.moon.setAttribute('opacity', clamp(1 - (k - .35) * 3).toFixed(3));
  R.B.sun.setAttribute('cy', f1(sy)); R.B.sunGlow.setAttribute('cy', f1(sy));
  R.B.sunGlow.setAttribute('opacity', (.4 + .6 * sun).toFixed(3));
  R.B.shaft.setAttribute('opacity', (.8 * sun).toFixed(3));
  const low = P(t, 6.5, .45, E.ioC), dua = P(t, 8.1, .6, E.ioC), onLap = t >= 8.1;
  const L2 = [lerp(-16, -40, low), lerp(-60, -8, low)], R2 = [lerp(16, 36, low), lerp(-62, -8, low)];
  let fb = { look: [0, 4], mouth: 'smile' };
  if (t > 6.55) fb = { eyes: 'happy', mouth: 'grin', brow: .3 };
  if (t > 8.2) fb = { eyes: 'closed', mouth: 'small' };
  const pb = { x: 540, y: 1660, s: 1.35, t, lean: Math.sin(t * 2) * .35, dy: lerp(4, 0, low), face: fb,
    hands: { L: [lerp(L2[0], -14, dua), lerp(L2[1], -80, dua)], R: [lerp(R2[0], 14, dua), lerp(R2[1], -80, dua)] },
    phone: onLap ? null : (low > .5 ? 'R' : 'both'), glow: 1 - .7 * low, faceLight: .45 * (1 - low) };
  R.yb.set(pb);
  R.yb.tint(mix('#191B3A', '#4A2E28', sun), lerp(.32, .14, sun));
  vis(R.lapPhone, onLap);
  R.lapPhone.setAttribute('transform', `translate(${f1(540 + 36 * 1.35)} ${f1(1660 - 4 * 1.35)}) rotate(-6)`);
  const pwb = R.yb.phoneWorld(pb);
  R.B.glow.setAttribute('cx', f1(pwb[0])); R.B.glow.setAttribute('cy', f1(pwb[1]));
  R.B.glow.setAttribute('opacity', onLap ? 0 : (.5 * (1 - .6 * sun) * (1 - low)).toFixed(3));
  // panneau actif / inactif
  const topOn = 1 - P(t, 4.7, .3), botOn = P(t, 4.7, .3), both = P(t, 9.6, .3);
  T($('#dTop'), { op: .55 * (1 - topOn) * (1 - both) });
  T($('#dBot'), { op: .55 * (1 - botOn) });
  pop(R.lTop, t, .1, 9.55); pop(R.lBot, t, .2, 9.55);
  for (const [n, a, b] of R.chips) pop(n, t, a, b);
  pop(R.motto, t, 9.7, 99);
  drawEnd(R.end, t, 10.6, 540, 960);
}
boot({ duration: 12.6, build, render });
</script>
</body>
</html>
