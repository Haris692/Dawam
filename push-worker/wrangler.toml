name = "dawam-push"
main = "src/index.js"
compatibility_date = "2024-09-23"

# KV namespace pour stocker les subscriptions
# À remplir après `wrangler kv namespace create SUBSCRIPTIONS`
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "011a83c71e714515b11cbf69cc490b13"

# Cron : envoie la notif quotidienne
# 3h UTC = 5h Paris (heure d'été) / 4h (hiver)
# Modifie selon ton fuseau horaire cible
[triggers]
crons = [
  "*/10 * * * *",  # Adaptatif — vérifie toutes les 10 min (aube, journee, soir)
  "15 14 * * *"    # Rappel 16h15 Paris (UTC+2 été) — rappel quotidien actions
]

# Variables publiques (les secrets VAPID sont dans wrangler secret)
[vars]
VAPID_SUBJECT = "mailto:harisgarrigos692@gmail.com"
