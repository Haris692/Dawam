<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="video-output" content="dawam-tiktok-08-lanterne.mp4">
<title>Dawam TikTok 08 — La lanterne et le réveil</title>
<link rel="stylesheet" href="../lib/base.css"><link rel="stylesheet" href="tk.css">
<!-- Format « personnage qui incarne le problème » (à la Duolingo), en version douce : la lanterne du logo et le réveil repoussé. -->
<style>
#sceneA{transform-origin:560px 1240px}
#warm{background:radial-gradient(60% 40% at 40% 62%,rgba(255,200,110,.5),rgba(255,200,110,0))}
.alarm{position:absolute;left:110px;top:720px;width:860px;padding:34px 40px 30px;border-radius:44px;background:rgba(250,247,242,.97);
  box-shadow:0 30px 70px -20px rgba(10,12,30,.6);font-family:Inter,var(--sans)}
.alarm .ah{font:600 30px/1 Inter,var(--sans);color:#8a8580}
.alarm .at{margin-top:14px;font:700 54px/1 Inter,var(--sans);color:#111}
.alarm .ab{margin-top:28px;display:flex;gap:20px}
.alarm .ab span{flex:1;height:88px;border-radius:44px;font:700 34px/88px Inter,var(--sans);text-align:center}
.alarm .rep{background:#E9E4DC;color:#111}.alarm .stop{background:#C8871F;color:#fff}
.bubble{position:absolute;padding:24px 34px;border-radius:40px;background:#fff;color:#141414;font:800 44px/1.3 var(--tk);text-align:center;
  box-shadow:0 20px 40px -16px rgba(0,0,0,.5);white-space:nowrap;transform-origin:50% 100%}
.bubble::after{content:"";position:absolute;left:50%;bottom:-18px;margin-left:-18px;border:18px solid transparent;border-top-color:#fff;border-bottom:0}
#tap,#tapring{position:absolute}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <svg id="sceneA" class="L" width="1080" height="1920"></svg>
  <div id="warm" class="L full"></div>
  <div class="tapring" id="tapring"></div><div class="tap" id="tap"></div>
</div></div>
<script src="../lib/engine.js"></script><script src="../lib/cartoon.js"></script><script src="../lib/decor.js"></script><script src="tk.js"></script>
<script>
'use strict';
const R = {};
const PAL = {
  wall: ['#232849', '#4F4A70', '#E9D8C4'], base: ['#1D2140', '#433E60', '#D9C4AA'], floor: ['#1A1E3E', '#3F3A58', '#C49E7B'],
  floorLine: ['#20244A', '#47415F', '#B38D6B'], rug: ['#2B2F57', '#5B4F6E', '#D8B48A'], rugLine: ['#363A66', '#6E5F7C', '#E6C79E'],
  frame: ['#30355E', '#625C82', '#F2E8DA'], sill: ['#2B3058', '#5A5479', '#EADFCF'], rod: ['#3A3F68', '#6B6488', '#B8936A'],
  curtain: ['#2F4A6A', '#4F6F8A', '#7FA3B8'], curtainLine: ['#25405E', '#456480', '#6E92A8'],
  skyTop: ['#0E1433', '#2A2F66', '#8EC5E8'], skyBot: ['#2A2A5C', '#7A5689', '#DDEFF7'], city: ['#0A0E26', '#1F1B3D', '#7E8AA0'],
  artFrame: ['#3A3557', '#6A5E7A', '#B8936A'], art: ['#2C3155', '#5E587C', '#F5EDE0'], artLine: ['#6B6286', '#A08C9C', '#BA7517'],
  stand: ['#2F2A45', '#5A4A5E', '#9C6B4A'], standTop: ['#383250', '#655467', '#B07D58'], lampStem: ['#3C3652', '#665A70', '#8C6A50'], lampShade: ['#4A4466', '#8A7E92', '#F2E3C8'],
  bedWood: ['#30283F', '#5B4858', '#8E5E44'], bedWoodDark: ['#251F33', '#4A3A48', '#6E4632'],
  sheet: ['#3A4270', '#7A7FA6', '#F2EEE6'], pillow: ['#46507E', '#8A8FB5', '#FBF8F2'], blanket: ['#2E4C6E', '#4F6F94', '#3E7C9A'], blanketLine: ['#253F5E', '#44628A', '#356C88'],
};
const ALARMS = [[1.2, 2.0, '05:52'], [3.3, 4.0, '05:57']];
const toStage = (x, y, k) => [560 + (x - 560) * k, 1240 + (y - 1240) * k];
// la lanterne du logo, en mascotte : yeux, joues, bouche
function lanternSVG(parent) {
  const g = el('g', {}, parent);
  const OL = 'stroke="#3A2A26" stroke-width="5" stroke-linejoin="round"';
  g.innerHTML = `<defs><radialGradient id="lnG"><stop offset="0" stop-color="#FFD98A" stop-opacity=".75"/><stop offset=".45" stop-color="#FFC060" stop-opacity=".25"/><stop offset="1" stop-color="#FFC060" stop-opacity="0"/></radialGradient>
    <radialGradient id="lnGlass" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#FFF6D6"/><stop offset="1" stop-color="#F2B648"/></radialGradient></defs>
    <circle class="halo" r="260" fill="url(#lnG)"/>
    <circle cx="0" cy="-138" r="14" fill="none" stroke="#3A2A26" stroke-width="11"/><circle cx="0" cy="-138" r="14" fill="none" stroke="#B4842E" stroke-width="5"/>
    <path d="M-50 -92Q0 -162 50 -92Z" fill="#C8871F" ${OL}/><circle cx="0" cy="-121" r="7" fill="#EAC876" ${OL}/>
    <rect x="-56" y="-100" width="112" height="16" rx="7" fill="#B4742A" ${OL}/>
    <rect x="-48" y="-84" width="96" height="140" rx="18" fill="#8A5A1E" ${OL}/>
    <rect x="-40" y="-74" width="80" height="120" rx="12" fill="url(#lnGlass)"/>
    <path class="flame" d="M0 -70C9 -57 11 -48 0 -39C-11 -48 -9 -57 0 -70Z" fill="#FFF8DC"/>
    <g class="face"></g>
    <rect x="-56" y="52" width="112" height="16" rx="7" fill="#B4742A" ${OL}/>
    <path d="M-40 68L40 68L28 96L-28 96Z" fill="#C8871F" ${OL}/>`;
  const face = g.querySelector('.face'), dark = '#3A2416';
  const cheeks = [-1, 1].map(sg => el('ellipse', { cx: sg * 26, cy: 6, rx: 7, ry: 4.5, fill: '#FF8A6A', opacity: .6 }, face));
  const eyes = [-1, 1].map(sg => {
    const e = { sg, g: el('g', {}, face) };
    e.open = el('g', {}, e.g);
    el('ellipse', { rx: 7, ry: 9.5, fill: dark }, e.open);
    el('circle', { cx: 2.4, cy: -3.4, r: 2.8, fill: '#fff' }, e.open);
    el('circle', { cx: -2.2, cy: 3.2, r: 1.3, fill: '#fff' }, e.open);
    e.lid = el('path', { d: '', fill: '#FBE3A6' }, e.g);
    e.closed = el('path', { d: '', fill: 'none', stroke: dark, 'stroke-width': 3.4, 'stroke-linecap': 'round' }, e.g);
    e.brow = el('path', { d: '', fill: 'none', stroke: dark, 'stroke-width': 3.4, 'stroke-linecap': 'round' }, e.g);
    return e;
  });
  const mouth = el('path', { d: '', fill: 'none', stroke: dark, 'stroke-width': 3.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, face);
  return { g, halo: g.querySelector('.halo'), flame: g.querySelector('.flame'), eyes, mouth, cheeks };
}
// f : { eyes:'open'|'closed'|'happy', lid, worry, mouth:'smile'|'flat'|'frown'|'open'|'o', look:[x,y] }
function lanternFace(L, f, t) {
  const ph = (t + .7) % 3.3, blink = ph < .16 ? Math.sin(ph / .16 * Math.PI) : 0;
  const lid = f.lid || 0, w = f.worry || 0, look = f.look || [0, 0];
  for (const e of L.eyes) {
    e.g.setAttribute('transform', `translate(${f1(e.sg * 15 + look[0])} ${f1(-8 + look[1])})`);
    const open = (f.eyes || 'open') === 'open' && blink < .8 && lid < .9;
    vis(e.open, open); vis(e.closed, !open); vis(e.lid, open && lid > .01); vis(e.brow, w > .01);
    if (open) {
      e.open.setAttribute('transform', `scale(1 ${(1 - blink).toFixed(3)})`);
      const ly = lerp(-11, 9, lid);
      e.lid.setAttribute('d', `M-10 -13H10V${f1(ly)}Q0 ${f1(ly + 3)} -10 ${f1(ly)}Z`);
    } else e.closed.setAttribute('d', f.eyes === 'happy' ? 'M-8 4Q0 -7 8 4' : 'M-8 -1Q0 6 8 -1');
    e.brow.setAttribute('d', `M${-e.sg * 3} ${f1(-17 - 4 * w)}L${e.sg * 9} ${f1(-15 + 2 * w)}`);
  }
  const m = { smile: ['M-9 8Q0 17 9 8', 'none'], flat: ['M-6 12L6 12', 'none'], frown: ['M-7 14Q0 8 7 14', 'none'],
    open: ['M-9 7Q0 9 9 7Q8 20 0 20Q-8 20 -9 7Z', '#7A3020'], o: ['M-5 11a5 6 0 1 0 10 0a5 6 0 1 0 -10 0Z', '#7A3020'] }[f.mouth || 'smile'];
  L.mouth.setAttribute('d', m[0]); L.mouth.setAttribute('fill', m[1]);
}
function build() {
  const st = $('#stage');
  R.A = bedroom($('#sceneA'), PAL);
  R.y = new Toon(R.A.person, { skin: '#C98A5E', hair: '#33221A', beard: true, top: '#7FA7D6', collar: 'pyjama', legs: 'none' });
  R.zz = buildZzz(R.A.front);
  R.L = lanternSVG(R.A.front);
  R.alarm = el2(st, '<div class="alarm"><div class="ah">⏰ Alarme</div><div class="at">Fajr · <b>05:52</b></div><div class="ab"><span class="rep">Répéter</span><span class="stop">Arrêter</span></div></div>');
  R.b1 = el2(st, '<div class="bubble">…</div>');
  R.b2 = el2(st, '<div class="bubble">😶</div>');
  R.b3 = el2(st, '<div class="bubble">Allez… juste 2 minutes<br>avec Allah 🤍</div>');
  R.c1 = cap(st, 'Quand tu repousses\nton réveil pour le Fajr…', 'w', 280);
  R.c2 = cap(st, '…pour la 3e fois 😅', 'w', 280);
  R.c3 = cap(st, 'Ok ok… j\'arrive 😭🤍', 'w', 280);
  R.end = tkEnd(st);
}
function render(t) {
  const k = 1.24 + .06 * P(t, 0, 9, E.lin);
  $('#sceneA').style.transform = `scale(${k.toFixed(4)})`;
  paint(R.A.pal, .05);
  // lanterne : flotte près de la fenêtre (triste quand on repousse), puis vient au-dessus du lit et brille
  const fly = P(t, 5.2, 1.0, E.ioC);
  const lx = lerp(850, 390, fly) + Math.sin(t * 1.3) * 10, ly = lerp(800, 940, fly) + Math.sin(t * 2.1) * 14;
  const dimmed = (t > 2.2 && t < 5.2) ? .55 : 1;
  const bright = lerp(dimmed, 1.6, P(t, 5.6, .8, E.outC));
  R.L.g.setAttribute('transform', `translate(${f1(lx)} ${f1(ly)}) rotate(${(Math.sin(t * 1.7) * 6).toFixed(2)}) scale(1.15)`);
  R.L.halo.setAttribute('opacity', clamp(.55 * bright, 0, 1).toFixed(3));
  R.L.halo.setAttribute('r', f1(220 + 90 * P(t, 5.6, .8, E.outC)));
  const fl = 1 + Math.sin(t * 17) * .08 + Math.sin(t * 11) * .05;
  R.L.flame.setAttribute('transform', `translate(0 -39) scale(${(1 / fl).toFixed(3)} ${fl.toFixed(3)}) translate(0 39)`);
  let lf = { mouth: 'smile', look: [-4, 3] };
  if (t > 2.2 && t < 5.2) lf = { lid: .45, worry: 1, mouth: t > 4.4 ? 'flat' : 'frown', look: [-4, 4] };
  else if (t >= 5.2 && t < 6.15) lf = { mouth: 'o', look: [-3, 4] };
  else if (t >= 6.15 && t < 7.7) lf = { mouth: Math.sin((t - 6.15) * 40) > 0 ? 'open' : 'smile', look: [3, 5] };
  else if (t >= 7.7) lf = { eyes: 'happy', mouth: 'open' };
  lanternFace(R.L, lf, t);
  T($('#warm'), { op: .9 * P(t, 5.7, .9, E.ioC) });
  // téléphone qui sonne sous son menton ; il repousse en dormant, puis se redresse
  const ring = ALARMS.some(([a, b]) => t > a && t < b + .15);
  const up = P(t, 7.2, 1.2, E.ioC), picked = t >= 7.2;
  const buzz = ring ? Math.sin(t * 80) * 2.4 : 0;
  R.A.setPhone(buzz, ring || picked ? 1 : 0, !picked);
  const b0 = bedBase(0), b = bedBase(up);
  const onPhone = toHip(b0, 434, 1286), restL = toHip(b0, 452, 1290), lieR = toHip(b0, 560, 1215);
  const snooze = Math.max(...ALARMS.map(([, z]) => P(t, z - .22, .2, E.ioC) * (1 - P(t, z + .05, .3, E.ioC))));
  const reach = P(t, 6.7, .5, E.ioC);
  const gL = Math.max(snooze, reach);
  let hL = [lerp(restL[0], onPhone[0], gL), lerp(restL[1], onPhone[1], gL)];
  hL = [lerp(hL[0], -18, up), lerp(hL[1], -64, up)];
  const ur = P(t, 7.4, 1.0, E.ioC);
  const hR = [lerp(lieR[0], 18, ur), lerp(lieR[1], -66, ur)];
  R.A.setBlanket(1 - up);
  let face = { eyes: 'closed', mouth: 'small' };
  if (ring || snooze > .05) face = { eyes: 'closed', worry: .8, mouth: 'wavy' };
  if (t > 5.8 && t < 7.2) face = { lid: t < 6.3 ? .95 : .5, worry: .3, mouth: 'flat', look: [-2, -3] };
  if (t >= 7.2) face = { eyes: up > .6 ? 'happy' : 'open', lid: up > .6 ? 0 : .3, mouth: 'smile', blush: 1, look: [-5, -4] };
  const pose = Object.assign(b, { lean: b.lean + Math.sin(t * 2.2) * .5 * (1 - up), dy: 4 * up, t, face, hands: { L: hL, R: hR },
    phone: picked ? (up > .85 ? 'both' : 'L') : null, phoneAng: lerp(-80, 0, up), glow: 1, faceLight: .5 });
  R.y.set(pose);
  R.y.tint('#141A3C', lerp(.48, .2, P(t, 5.7, .9)));
  const hw = R.y.headWorld(pose);
  drawZzz(R.zz, t, hw[0] + 60, hw[1] - 110, 1 - P(t, 5.6, .4));
  const pw = picked ? R.y.phoneWorld(pose) : [BED.phone[0] + buzz, BED.phone[1]];
  for (const g of [R.A.glow, R.A.glow2]) { g.setAttribute('cx', f1(pw[0])); g.setAttribute('cy', f1(pw[1])); }
  R.A.glow.setAttribute('opacity', (ring || picked ? .8 : 0).toFixed(3));
  R.A.glow2.setAttribute('opacity', (.3 * up).toFixed(3));
  // alarme + toucher « Répéter »
  const al = ALARMS.find(([a, z]) => t > a - .05 && t < z + .4);
  if (al) { R.alarm.querySelector('b').textContent = al[2]; pop(R.alarm, t, al[0], al[1] + .2); } else T(R.alarm, { op: 0 });
  const tp = ALARMS.find(([, z]) => t > z - .05 && t < z + .7);
  const tap = $('#tap'), ring2 = $('#tapring');
  if (tp) {
    const lt = t - tp[1];
    tap.style.left = ring2.style.left = '340px'; tap.style.top = ring2.style.top = '924px';
    const a = P(lt, -.05, .15), press = P(lt, .1, .1) - P(lt, .22, .12), fo = P(lt, .3, .25), rp = P(lt, .22, .5, E.outC);
    T(tap, { s: lerp(1.3, 1, a) - .14 * press, op: a * (1 - fo) });
    T(ring2, { s: 1 + 1.4 * rp, op: rp > 0 ? 1 - rp : 0 });
  } else { T(tap, { op: 0 }); T(ring2, { op: 0 }); }
  // bulles de la lanterne (placées au-dessus d'elle, en coordonnées écran)
  const [bx, by] = toStage(lx, ly - 180, k);
  for (const [bb, a, z] of [[R.b1, 2.4, 3.2], [R.b2, 4.45, 5.05], [R.b3, 6.15, 8.75]]) {
    bb.style.left = (bx - bb.offsetWidth / 2).toFixed(1) + 'px'; bb.style.top = (by - bb.offsetHeight - 30).toFixed(1) + 'px';
    pop(bb, t, a, z);
  }
  pop(R.c1, t, .1, 5.0); pop(R.c2, t, 5.0, 7.2); pop(R.c3, t, 7.4, 8.85);
  const [ex, ey] = toStage(lx, ly, k);
  drawEnd(R.end, t, 8.9, ex, ey);
}
boot({ duration: 11, build, render });
</script>
</body>
</html>
