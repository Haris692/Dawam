<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="video-output" content="dawam-tiktok-10-satisfaisant.mp4">
<title>Dawam TikTok 10 — 30 jours en 8 secondes</title>
<link rel="stylesheet" href="../lib/base.css"><link rel="stylesheet" href="../lib/screens.css"><link rel="stylesheet" href="tk.css">
<!-- Format micro-vidéo « satisfaisante » (≤ 10 s, se regarde en boucle). -->
</head>
<body>
<div id="viewport"><div id="stage">
  <div class="L softbg"></div>
  <svg id="sparks" class="L" width="1080" height="1920"></svg>
  <div id="gridW" class="L full"></div>
  <svg id="burst" class="L" width="1080" height="1920"></svg>
</div></div>
<script src="../lib/engine.js"></script><script src="../lib/screens.js"></script><script src="tk.js"></script>
<script>
'use strict';
const R = {};
const G0 = .8, STEP = .17;
const BADGES = [['Première semaine ✓', 2.0], ['2 semaines ✓', 3.2], ['30 jours ✓ 🏆', 5.8]];
function build() {
  const st = $('#stage');
  R.sp = buildSparks($('#sparks'), '#C99A3E', 7, 22);
  $('#gridW').innerHTML = gridCard('g', 70, 640, 940, 6, 30);
  R.c1 = cap(st, '30 jours de constance\nen 8 secondes ✨', 'w', 250);
  R.count = el2(st, '<div class="c" style="top:510px"><div class="sticker gold" style="position:relative;display:inline-block;font-size:54px">🔥 <span id="n">0</span> jours</div></div>');
  R.badges = BADGES.map(([txt, t0], i) => [el2(st, `<div class="c" style="top:1520px"><div class="sticker white" style="position:relative;display:inline-block;font-size:38px">${txt}</div></div>`), t0, BADGES[i + 1] ? BADGES[i + 1][1] : 6.55]);
  const rr = mulberry32(12); R.burst = [];
  for (let i = 0; i < 26; i++) R.burst.push({ el: el('path', { d: SPARK, fill: '#D9A94E' }, $('#burst')), an: i / 26 * Math.PI * 2 + rr() * .3, d: 300 + rr() * 300, s: 10 + rr() * 14 });
  R.end = tkEnd(st);
}
function render(t) {
  drawSparks(R.sp, t, .8, $('#sparks'));
  drawGrid($('#g'), t, G0, STEP);
  const filled = clamp(Math.floor((t - G0) / STEP) + 1, 0, 30);
  $('#n').textContent = filled;
  T(R.count, { s: 1 + .06 * Math.max(0, Math.sin((t - G0) / STEP * Math.PI)) * (filled > 0 && filled < 30 ? 1 : 0), op: 1 });
  // tout s'illumine à la fin
  const done = P(t, G0 + 29 * STEP + .3, .5, E.outB);
  T($('#g'), { s: 1 + .03 * done * Math.max(0, Math.sin((t - 6) * 6)) });
  for (const b of R.burst) {
    const pr = P(t, 5.95, 1.0, E.outC), f = P(t, 6.35, .6);
    b.el.setAttribute('transform', `translate(${f1(540 + Math.cos(b.an) * b.d * pr)} ${f1(1060 + Math.sin(b.an) * b.d * pr * .8)}) scale(${(b.s * (pr > 0 ? 1 - .5 * f : 0)).toFixed(2)})`);
    b.el.setAttribute('opacity', (pr > 0 ? 1 - f : 0).toFixed(3));
  }
  pop(R.c1, t, .1, 6.55);
  for (const [n, a, b] of R.badges) pop(n, t, a, b);
  drawEnd(R.end, t, 6.6, 540, 1060);
}
boot({ duration: 8.6, build, render });
</script>
</body>
</html>
