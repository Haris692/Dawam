<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="video-output" content="dawam-tiktok-03-conversation.mp4">
<title>Dawam TikTok 03 — Conversation</title>
<link rel="stylesheet" href="../lib/base.css"><link rel="stylesheet" href="tk.css">
<!-- Format « conversation » : une discussion mise en scène qui se lit comme un échange entre amies (contenu organique, pas un vrai témoignage). -->
<style>
#chatbg{width:1080px;height:1920px;background:#FBF7F1}
.chead{position:absolute;left:0;top:0;width:1080px;height:250px;background:rgba(251,247,241,.97);border-bottom:2px solid #EEE6DA;z-index:3}
.chead .sb{transform:scale(1.9);transform-origin:0 0}
.chead .back{position:absolute;left:44px;top:150px;font:400 70px/1 Inter,var(--sans);color:var(--accent)}
.chead .av{position:absolute;left:120px;top:142px;width:86px;height:86px;border-radius:50%;background:linear-gradient(135deg,#F2A7B8,#D97A93);
  color:#fff;font:800 40px/86px var(--sans);text-align:center}
.chead .nm{position:absolute;left:226px;top:148px;font:700 40px/1.1 Inter,var(--sans);color:#1d1d1f}
.chead .on{position:absolute;left:226px;top:198px;font:500 26px/1 Inter,var(--sans);color:#1F9D63}
#msgs{position:absolute;left:0;top:290px;width:1080px}
.msg{position:absolute;max-width:780px;padding:26px 34px;border-radius:46px;font:500 44px/1.32 Inter,var(--sans);transform-origin:0 100%}
.msg.in{left:40px;background:#ECE6DD;color:#1d1d1f;border-bottom-left-radius:14px}
.msg.out{right:40px;background:linear-gradient(135deg,#D9A94E,#B8781F);color:#fff;border-bottom-right-radius:14px;transform-origin:100% 100%}
.msg.img{padding:12px;background:linear-gradient(135deg,#D9A94E,#B8781F)}
.msg.img img{display:block;width:500px;height:420px;object-fit:cover;object-position:top;border-radius:36px}
.typing{position:absolute;left:40px;padding:30px 36px;border-radius:46px;border-bottom-left-radius:14px;background:#ECE6DD;display:flex;gap:12px}
.typing i{width:18px;height:18px;border-radius:50%;background:#9A9086}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="chatbg" class="L"></div>
  <div id="msgs"></div>
  <div class="chead"><div class="av">S</div><div class="back">‹</div><div class="nm">Sarah 🌸</div><div class="on">en ligne</div></div>
</div></div>
<script src="../lib/engine.js"></script><script src="tk.js"></script>
<script>
'use strict';
const R = {};
// [début, qui, texte]  (qui : in = Sarah, out = moi ; img = capture de l'app)
const MSGS = [
  [.6, 'in', 'Sérieux, comment tu fais pour être aussi régulière dans tes prières ? 😭'],
  [2.6, 'out', 'Franchement ? Petit à petit 🤍'],
  [3.7, 'out', "J'ai une app qui me rappelle au bon moment"],
  [5.4, 'in', 'laquelle ?? 👀'],
  [6.6, 'out', 'Dawam. Elle te fait un programme selon ton niveau'],
  [8.0, 'img', ''],
  [10.2, 'in', 'attends je la télécharge 😭🤍'],
  [11.3, 'out', 'Petit, mais constant ✨'],
];
const TYPING = [[.1, .6], [4.6, 5.4], [9.4, 10.2]];
function build() {
  const st = $('#stage');
  $('.chead').insertAdjacentHTML('afterbegin', STATUSBAR('#1d1d1f'));
  const box = $('#msgs');
  R.m = MSGS.map(([t0, who, txt]) => {
    const n = document.createElement('div');
    n.className = 'msg ' + (who === 'img' ? 'out img' : who);
    n.innerHTML = who === 'img' ? '<img src="../assets/screens/parcours.jpg" alt="">' : txt;
    box.appendChild(n);
    return { n, t0 };
  });
  R.typing = document.createElement('div'); R.typing.className = 'typing'; R.typing.innerHTML = '<i></i><i></i><i></i>';
  box.appendChild(R.typing);
  R.hook = cap(st, 'Quand ta pote te demande\nton secret 🤫', 'w', 700);
  R.end = tkEnd(st);
}
function layout() {
  // positions verticales (mesurées une fois les polices chargées) ; écart réduit entre bulles d'un même côté
  const side = w => w === 'in' ? 'in' : 'out';
  let y = 0;
  R.m.forEach((m, i) => {
    m.y = y; m.n.style.top = y + 'px';
    y += m.n.offsetHeight + (MSGS[i + 1] && side(MSGS[i + 1][1]) === side(MSGS[i][1]) ? 14 : 34);
  });
  R.h = y;
}
function render(t) {
  if (!R.h) layout();
  $('#msgs').style.transform = `translateY(${(-scrollAt(t)).toFixed(1)}px)`;
  R.m.forEach(m => {
    const a = P(t, m.t0, .38, E.outB2);
    T(m.n, { s: lerp(.6, 1, a), op: P(t, m.t0, .1) });
  });
  const tp = TYPING.find(([a, b]) => t >= a && t < b);
  if (tp) {
    const next = R.m.find(m => m.t0 === tp[1]);
    R.typing.style.top = next.y + 'px';
    T(R.typing, { s: P(t, tp[0], .25, E.outB), op: 1 });
    R.typing.querySelectorAll('i').forEach((d, i) => d.style.transform = `translateY(${(-8 * Math.max(0, Math.sin((t - tp[0]) * 9 - i * .9))).toFixed(1)}px)`);
  } else T(R.typing, { op: 0 });
  pop(R.hook, t, .1, 2.5);
  drawEnd(R.end, t, 12.9, 540, 1000);
}
// défilement lissé : vise le bas du dernier message affiché
function scrollAt(t) {
  const keys = [];
  for (const m of R.m) keys.push([m.t0, Math.max(0, m.y + m.n.offsetHeight - 1180)]);
  for (const [a, b] of TYPING) { const n = R.m.find(m => m.t0 === b); keys.push([a, Math.max(0, n.y + 120 - 1180)]); }
  keys.sort((p, q) => p[0] - q[0]);
  let v = 0, prev = 0;
  for (const [k, val] of keys) { const target2 = Math.max(prev, val); v = lerp(v, target2, P(t, k, .35, E.outC)); prev = target2; }
  return v;
}
boot({ duration: 15, build, render });
</script>
</body>
</html>
