<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="video-output" content="dawam-tiktok-06-secret.mp4">
<title>Dawam TikTok 06 — L'app secrète</title>
<link rel="stylesheet" href="../lib/base.css"><link rel="stylesheet" href="tk.css">
<!-- Format « app secrète » (accroche FOMO) : écran flouté, puis révélation. -->
<style>
#flash{background:#FFF6E0}
#shh{position:absolute;left:0;top:1060px;width:1080px;text-align:center;font-size:190px;line-height:1}
.pattern path{fill:none;stroke-width:1.6}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div class="L nightbg"></div>
  <svg id="pat" class="L pattern" width="1080" height="1920"></svg>
  <svg id="sparks" class="L" width="1080" height="1920"></svg>
  <div id="phoneWrap" class="L" style="left:244px;top:600px;width:592px;height:1246px"></div>
  <div id="shh">🤫</div>
  <svg id="burst" class="L" width="1080" height="1920"></svg>
  <div id="flash" class="L full"></div>
</div></div>
<script src="../lib/engine.js"></script><script src="tk.js"></script>
<script>
'use strict';
const R = {};
const REVEAL = 4.6;
function build() {
  const st = $('#stage');
  R.pat = buildPattern($('#pat'), '#B7A6F0');
  R.sp = buildSparks($('#sparks'), '#FFE7B0', 13, 24);
  R.phone = makePhone(['parcours', 'adhkar-matin', 'profil']);
  $('#phoneWrap').appendChild(R.phone);
  R.scr = R.phone.querySelector('.screen');
  R.c1 = cap(st, 'L\'app que les gens réguliers\ndans leurs adorations\nne partagent pas… 🤫', 'w', 260);
  R.c2 = cap(st, 'Bon… je vous la donne 👇', 'w', 300);
  R.c3 = cap(st, 'Rappels + programme\n+ constance 🔥', 'w', 270);
  R.name = el2(st, '<div class="c" style="top:470px"><div class="sticker gold" style="position:relative;display:inline-block;font-size:52px">Dawam ✨</div></div>');
  const rr = mulberry32(5); R.burst = [];
  for (let i = 0; i < 22; i++) R.burst.push({ el: el('path', { d: SPARK, fill: '#FFE7B0' }, $('#burst')), an: i / 22 * Math.PI * 2 + rr() * .3, d: 260 + rr() * 260, s: 10 + rr() * 14 });
  R.end = tkEnd(st);
}
function render(t) {
  drawPattern(R.pat, t, 0, .08, $('#pat'));
  drawSparks(R.sp, t, .9, $('#sparks'));
  const rv = P(t, REVEAL, .45, E.outC);
  R.scr.style.filter = rv < 1 ? `blur(${(18 * (1 - rv)).toFixed(2)}px)` : 'none';
  const shake = t < REVEAL ? Math.sin(t * 40) * 2 * P(t, 1.5, .5) : 0;
  T($('#phoneWrap'), { x: shake, y: Math.sin(t * 1.5) * 5, s: .88 + .05 * P(t, REVEAL, .6, E.outB) });
  T($('#shh'), { s: lerp(.6, 1, P(t, .3, .5, E.outB2)) * (1 + .05 * Math.sin(t * 3)), op: P(t, .3, .2) * (1 - P(t, REVEAL - .1, .2)) });
  T($('#flash'), { op: .85 * P(t, REVEAL, .08) * (1 - P(t, REVEAL + .08, .35)) });
  for (const b of R.burst) {
    const pr = P(t, REVEAL, 1.0, E.outC), f = P(t, REVEAL + .4, .6);
    b.el.setAttribute('transform', `translate(${f1(540 + Math.cos(b.an) * b.d * pr)} ${f1(1220 + Math.sin(b.an) * b.d * pr)}) scale(${(b.s * (pr > 0 ? 1 - .5 * f : 0)).toFixed(2)})`);
    b.el.setAttribute('opacity', (pr > 0 ? 1 - f : 0).toFixed(3));
  }
  // après la révélation : parcours → invocations → profil
  const imgs = R.phone.querySelectorAll('.screen>img');
  imgs[1].style.transform = `translateX(${((1 - P(t, 5.9, .35, E.ioC)) * 100).toFixed(2)}%)`;
  imgs[2].style.transform = `translateX(${((1 - P(t, 6.7, .35, E.ioC)) * 100).toFixed(2)}%)`;
  pop(R.c1, t, .1, 4.0);
  pop(R.c2, t, 4.0, 5.3);
  pop(R.name, t, REVEAL + .05, 7.45);
  pop(R.c3, t, 5.3, 7.45);
  drawEnd(R.end, t, 7.5, 540, 1220);
}
boot({ duration: 9.6, build, render });
</script>
</body>
</html>
